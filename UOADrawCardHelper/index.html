<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111826">
  <meta name="description" content="Uni's on air 抽卡记录与分池优先级助手">
  <title>ユニエア · 抽卡助手</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23111826'/%3E%3Cpath d='M17 17h30v30H17z' fill='none' stroke='%23e9bf77' stroke-width='4'/%3E%3Cpath d='m23 33 7 7 12-16' fill='none' stroke='%23e9bf77' stroke-linecap='round' stroke-linejoin='round' stroke-width='4'/%3E%3C/svg%3E">
  <style>
    :root{font-family:Inter,"Noto Sans SC","Microsoft YaHei",sans-serif;color:#ecf0f7;background:#0c1220;font-size:16px}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 88% -10%,#26395a 0,transparent 37%),#0c1220}button,input,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #e9bf77;outline-offset:3px}.shell{max-width:1240px;margin:auto;padding:34px 28px 80px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:30px}.eyebrow{color:#e9bf77;font-size:.8rem;letter-spacing:.19em;font-weight:800;margin:0 0 8px}.top h1{font-size:clamp(1.8rem,3vw,2.7rem);letter-spacing:-.04em;margin:0}.top p{color:#a9b4c8;margin:8px 0 0}.top-actions{display:flex;gap:10px;flex-wrap:wrap}.btn{border:1px solid #536078;background:#1b2941;color:#f2f5fa;border-radius:10px;padding:11px 17px;font-weight:700;white-space:nowrap}.btn:hover{background:#273957}.btn.primary{background:#e9bf77;border-color:#e9bf77;color:#192031}.btn.primary:hover{background:#f3cd8d}.btn.subtle{background:transparent}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:24px}.stat{border:1px solid #2b3850;border-radius:16px;background:#141e30;padding:20px 23px}.stat span{display:block;color:#a9b4c8;font-size:.9rem}.stat strong{display:block;font-size:2rem;margin-top:4px;letter-spacing:-.04em}.stat.highlight{border-color:#8e7656;background:linear-gradient(130deg,#302c2c,#1e2737)}.stat.highlight strong{color:#f0c985;font-size:1.3rem;margin-top:12px;line-height:1.3}.section-head{display:flex;justify-content:space-between;align-items:end;gap:16px;margin:28px 0 15px}.section-head h2{font-size:1.15rem;margin:0}.section-head p{color:#a9b4c8;font-size:.88rem;margin:5px 0 0}.sort-note{font-size:.85rem;color:#e9bf77}.list{display:grid;gap:14px}.pool{background:#141e30;border:1px solid #2c3950;border-radius:16px;padding:20px 22px}.pool:first-child{border-color:#ad8957}.pool-head{display:flex;align-items:start;justify-content:space-between;gap:18px}.pool-title{display:flex;align-items:center;gap:10px;min-width:0}.rank{display:grid;place-items:center;flex:none;width:30px;height:30px;border-radius:8px;background:#26354d;color:#e9bf77;font-size:.8rem;font-weight:800}.name{background:transparent;border:1px solid transparent;border-radius:6px;color:#fff;font-size:1.12rem;font-weight:750;min-width:0;width:min(290px,42vw);padding:4px}.name:hover,.name:focus{border-color:#536078}.pool-count{text-align:right;white-space:nowrap}.pool-count strong{font-size:1.2rem;color:#f0c985}.pool-count span{display:block;color:#a9b4c8;font-size:.8rem;margin-top:3px}.progress{height:6px;background:#29364b;border-radius:20px;margin:17px 0 18px;overflow:hidden}.progress>div{height:100%;background:#e9bf77;border-radius:20px}.members{display:flex;flex-wrap:wrap;gap:9px}.member{border:1px solid #43516a;border-radius:8px;padding:9px 12px;background:#1d2a40;color:#d6deea;min-height:40px}.member:hover{border-color:#e9bf77}.member.got{background:#3e352a;border-color:#a68556;color:#f8dba7}.member .check{display:inline-block;width:18px;color:#f4c77b;font-weight:900}.empty{border:1px dashed #526078;border-radius:16px;text-align:center;padding:50px 20px;background:#141e30}.empty h2{margin:0 0 8px}.empty p{color:#a9b4c8;margin:0 0 20px}.dialog{border:1px solid #566279;border-radius:18px;background:#172235;color:#ecf0f7;width:min(620px,calc(100% - 30px));padding:26px;box-shadow:0 24px 80px #0009}.dialog::backdrop{background:#030711bb}.dialog h2{margin:0 0 8px}.dialog p{color:#b9c3d3;line-height:1.5;margin:0 0 17px}.dialog textarea{display:block;width:100%;min-height:260px;resize:vertical;background:#0d1728;border:1px solid #47546c;border-radius:10px;color:#fff;padding:14px;line-height:1.6}.dialog-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:17px}.error{color:#ffb9a9!important;min-height:1.4em;margin:8px 0 0!important;font-size:.85rem}.hint{color:#a9b4c8;font-size:.83rem;margin-top:22px;line-height:1.6}@media(max-width:680px){.shell{padding:22px 16px 60px}.top{display:block}.top-actions{margin-top:18px}.stats{grid-template-columns:repeat(2,1fr)}.stat.highlight{grid-column:1/-1}.stat{padding:16px}.pool{padding:17px}.pool-head{gap:7px}.name{width:min(210px,45vw)}.sort-note{display:none}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="top"><div><div class="eyebrow">UNI'S ON AIR / DRAW TRACKER</div><h1>ユニエア抽卡助手</h1><p>记录已获得的 SSR，优先查看完成比例最低的分池。</p></div><div class="top-actions"><button class="btn primary" id="importBtn">＋ 导入卡池</button><button class="btn subtle" id="resetBtn" hidden>重置抽中状态</button><button class="btn subtle" id="clearBtn" hidden>清空记录</button></div></header>
    <section class="stats" aria-label="总体统计"><div class="stat"><span>分池数量</span><strong id="poolTotal">0</strong></div><div class="stat"><span>已抽中 / SSR 总数</span><strong id="overall">0 / 0</strong></div><div class="stat highlight"><span>下次优先抽取</span><strong id="nextPool">导入卡池后显示</strong></div></section>
    <div class="section-head"><div><h2>分池进度</h2><p>点击成员名切换抽中状态；点击分池名可直接修改。</p></div><span class="sort-note">按抽中比例从低到高排序</span></div>
    <section class="list" id="poolList" aria-live="polite"></section>
    <p class="hint">数据自动保存在此浏览器中。导入新文本会替换当前卡池及抽卡记录。</p>
  </main>
  <dialog class="dialog" id="importDialog"><form method="dialog" id="importForm"><h2>导入卡池</h2><p>每行一位成员，空行分隔分池。序号和数字会自动去掉。导入后可修改分池名称。</p><textarea id="importText" placeholder="1 小林由依&#10;2 森田ひかる&#10;3 山﨑天&#10;&#10;1 加藤史帆&#10;2 小坂菜緒" aria-label="卡池成员名单"></textarea><p class="error" id="importError" role="alert"></p><div class="dialog-actions"><button class="btn subtle" value="cancel">取消</button><button class="btn primary" id="confirmImport" value="default">导入并替换</button></div></form></dialog>
  <script>
    const KEY='uoa-draw-card-helper-v1';
    const $=id=>document.getElementById(id);
    const defaultPoolName=i=>i<4?`白 vol${i+1}`:i<8?`蓝 vol${i-3}`:`分池 ${i+1}`;
    let pools=[];
    try{const saved=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(saved))pools=saved.filter(p=>p&&Array.isArray(p.members)).map((p,i)=>({id:String(p.id||i),name:!p.name||p.name===`分池 ${i+1}`?defaultPoolName(i):String(p.name),members:p.members.filter(m=>m&&m.name).map(m=>({name:String(m.name),got:!!m.got}))}));}catch{}
    const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(pools));}catch{}};
    function parse(text){return text.replace(/\r/g,'').trim().split(/\n\s*\n+/).map(block=>block.split('\n').map(line=>line.replace(/[\d０-９]/g,'').replace(/[\s\u3000]+/g,'').trim()).filter(Boolean)).filter(group=>group.length);}
    function render(){
      const total=pools.reduce((n,p)=>n+p.members.length,0),got=pools.reduce((n,p)=>n+p.members.filter(m=>m.got).length,0);
      $('poolTotal').textContent=pools.length;$('overall').textContent=`${got} / ${total}`;$('resetBtn').hidden=!pools.length;$('resetBtn').disabled=!got;$('clearBtn').hidden=!pools.length;
      const sorted=[...pools].sort((a,b)=>{const ar=a.members.filter(m=>m.got).length/a.members.length,br=b.members.filter(m=>m.got).length/b.members.length;return ar-br||pools.indexOf(a)-pools.indexOf(b)});
      $('nextPool').textContent=sorted.find(p=>p.members.some(m=>!m.got))?.name|| (pools.length?'全部已抽中':'导入卡池后显示');
      const list=$('poolList');list.replaceChildren();
      if(!pools.length){const empty=document.createElement('div');empty.className='empty';empty.innerHTML='<h2>还没有卡池</h2><p>粘贴成员名单，开始记录 SSR 抽取进度。</p>';const btn=document.createElement('button');btn.className='btn primary';btn.textContent='导入卡池';btn.onclick=()=>openImport();empty.append(btn);list.append(empty);return;}
      sorted.forEach((pool,index)=>{
        const count=pool.members.filter(m=>m.got).length,card=document.createElement('article');card.className='pool';
        const head=document.createElement('div');head.className='pool-head';const title=document.createElement('div');title.className='pool-title';
        const rank=document.createElement('span');rank.className='rank';rank.textContent=String(index+1).padStart(2,'0');
        const name=document.createElement('input');name.className='name';name.value=pool.name;name.setAttribute('aria-label',`第 ${index+1} 个分池名称`);name.maxLength=40;
        name.addEventListener('change',()=>{pool.name=name.value.trim()||defaultPoolName(pools.indexOf(pool));save();render();});
        title.append(rank,name);const ratio=document.createElement('div');ratio.className='pool-count';const num=document.createElement('strong');num.textContent=`${count} / ${pool.members.length}`;const percent=document.createElement('span');percent.textContent=`${Math.round(count/pool.members.length*100)}% 已抽中`;ratio.append(num,percent);head.append(title,ratio);
        const track=document.createElement('div');track.className='progress';track.setAttribute('role','progressbar');track.setAttribute('aria-label',`${pool.name} 抽中比例`);track.setAttribute('aria-valuenow',String(count));track.setAttribute('aria-valuemin','0');track.setAttribute('aria-valuemax',String(pool.members.length));const fill=document.createElement('div');fill.style.width=`${count/pool.members.length*100}%`;track.append(fill);
        const members=document.createElement('div');members.className='members';[...pool.members].sort((a,b)=>Number(b.got)-Number(a.got)||pool.members.indexOf(a)-pool.members.indexOf(b)).forEach(member=>{const btn=document.createElement('button');btn.type='button';btn.className='member'+(member.got?' got':'');btn.setAttribute('aria-pressed',String(member.got));btn.setAttribute('aria-label',`${member.name}，${member.got?'已抽中':'未抽中'}`);const mark=document.createElement('span');mark.className='check';mark.textContent=member.got?'✓':'○';btn.append(mark,document.createTextNode(member.name));btn.onclick=()=>{member.got=!member.got;save();render()};members.append(btn)});
        card.append(head,track,members);list.append(card);
      });
    }
    function openImport(){$('importError').textContent='';$('importDialog').showModal();$('importText').focus()}
    $('importBtn').onclick=openImport;
    $('resetBtn').onclick=()=>{if(confirm('确定将所有成员重置为未抽中吗？分池和成员名单会保留。')){pools.forEach(pool=>pool.members.forEach(member=>member.got=false));save();render()}};
    $('importForm').addEventListener('submit',e=>{if(e.submitter?.value==='cancel')return;const groups=parse($('importText').value);if(!groups.length){e.preventDefault();$('importError').textContent='请至少输入一位成员。';return;}pools=groups.map((names,i)=>({id:`${Date.now()}-${i}`,name:defaultPoolName(i),members:names.map(name=>({name,got:false}))}));save();render();$('importText').value='';});
    $('clearBtn').onclick=()=>{if(confirm('确定清空所有分池和抽卡记录吗？')){pools=[];save();render()}};
    render();
  </script>
</body>
</html>
